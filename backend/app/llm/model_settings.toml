# Request settings per model, keyed by OpenRouter ID. Source: https://openrouter.ai/api/v1/models
# (fields `reasoning` and `supported_parameters`), checked on the date in each row.
#
# reasoning_effort = the lowest level the model allows: `mandatory: false` -> "none";
# `mandatory: true` -> the lowest of `supported_efforts`
# (order: none < minimal < low < medium < high < xhigh < max).
# temperature = the model lists `temperature` in `supported_parameters`.
# structured_method (optional, default "function_calling") is set only when the dev baseline
# shows that a model cannot answer by tool call.
# A model missing here fails the worker on start: add a row here and one in prices.toml.

