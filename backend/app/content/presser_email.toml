# League presser e-mail (spec 012). Placeholders in {braces} are filled by
# app/presser/render.py; values put into the HTML are escaped by the renderer. The plain-text
# part is the presser itself, ready to paste into WhatsApp.

[title]
presser = "Presser GW{gameweek} — {league}"

[header]
kicker = "The Gaffer's Presser"
headline = "Presser GW{gameweek}"
league = "{league}"

[whatsapp]
button = "📲 Wyślij na WhatsApp"

[footer]
text = "The Gaffer's Presser · tekst przeczytaj przed wysłaniem do ligi"

[html]
document = """<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{title}</title></head>
<body style="margin:0;padding:0;background:#f2f3f5;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d2433;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f3f5;"><tr><td align="center" style="padding:16px 8px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
<tr><td style="background:#37003c;border-radius:12px 12px 0 0;padding:20px 20px 16px;color:#ffffff;">
<div style="font-size:13px;opacity:.75;letter-spacing:.04em;text-transform:uppercase;">{kicker}</div>
<div style="font-size:22px;font-weight:700;margin-top:4px;">{headline}</div>
<div style="font-size:14px;margin-top:6px;opacity:.9;">{league}</div>
</td></tr>
{body}
{share}<tr><td style="background:#ffffff;border-radius:0 0 12px 12px;padding:12px 20px 16px;border-top:1px solid #e6e8ec;font-size:12px;color:#8a92a3;">{footer}</td></tr>
</table></td></tr></table>
</body></html>"""
body = """<tr><td style="background:#ffffff;padding:16px 20px 8px;font-size:15px;line-height:1.5;">{paragraphs}</td></tr>"""
paragraph = """<p style="margin:0 0 12px;">{text}</p>"""
line_break = "<br>"
share = """<tr><td style="background:#ffffff;padding:4px 20px 16px;"><a href="{url}" style="display:inline-block;background:#25d366;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;border-radius:8px;padding:10px 16px;">{label}</a></td></tr>
"""
