[project]
name = "gaffers-presser-backend"
version = "0.1.0"
description = "Backend of The Gaffer's Presser"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel==0.0.48",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "pydantic-settings==2.16.2",
    "typer==0.27.3",
    "twscrape==0.20.1",
    "langgraph==1.2.18",
    "langchain-core==1.7.1",
    "langfuse==4.18.0",
    "langchain-openrouter==0.2.9",
    "pgvector==0.5.1",
    "openrouter==0.11.46",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
